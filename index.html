        <style>

            /* =====================================================
               DBOTPRINT SPLASH SCREEN
               ===================================================== */

            #dbotprint-splash {
                position: fixed;
                inset: 0;
                z-index: 999999;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;

                background:
                    radial-gradient(
                        circle at 20% 20%,
                        rgba(101, 65, 255, 0.28),
                        transparent 38%
                    ),
                    radial-gradient(
                        circle at 80% 80%,
                        rgba(0, 153, 255, 0.22),
                        transparent 40%
                    ),
                    linear-gradient(
                        135deg,
                        #050816 0%,
                        #090d24 45%,
                        #10113a 100%
                    );

                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;

                transition:
                    opacity 0.8s ease,
                    visibility 0.8s ease;
            }

            #dbotprint-splash.dbp-hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            /* Background glow */

            .dbp-glow {
                position: absolute;
                width: 55rem;
                height: 55rem;
                border-radius: 50%;

                background: radial-gradient(
                    circle,
                    rgba(99, 62, 255, 0.18) 0%,
                    rgba(30, 100, 255, 0.08) 35%,
                    transparent 70%
                );

                filter: blur(25px);
                animation: dbpPulse 4s ease-in-out infinite;
            }

            @keyframes dbpPulse {
                0%,
                100% {
                    transform: scale(0.9);
                    opacity: 0.65;
                }

                50% {
                    transform: scale(1.1);
                    opacity: 1;
                }
            }

            /* Glass card */

            .dbp-card {
                position: relative;
                width: min(90%, 46rem);
                min-height: 52rem;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                padding: 4.5rem 3rem;

                border: 1px solid rgba(255, 255, 255, 0.10);
                border-radius: 2.8rem;

                background:
                    linear-gradient(
                        145deg,
                        rgba(21, 27, 58, 0.92),
                        rgba(7, 12, 32, 0.88)
                    );

                box-shadow:
                    0 3rem 8rem rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.07),
                    0 0 7rem rgba(89, 62, 255, 0.10);

                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);

                text-align: center;
            }

            /* Logo */

            .dbp-logo {
                position: relative;

                width: 9rem;
                height: 9rem;

                display: flex;
                align-items: center;
                justify-content: center;

                margin-bottom: 2.5rem;

                border-radius: 2.4rem;

                background:
                    linear-gradient(
                        145deg,
                        rgba(124, 79, 255, 0.22),
                        rgba(20, 126, 255, 0.10)
                    );

                border: 1px solid rgba(150, 120, 255, 0.28);

                box-shadow:
                    0 0 3rem rgba(112, 71, 255, 0.32),
                    inset 0 0 2rem rgba(255, 255, 255, 0.04);

                animation: dbpLogoFloat 3s ease-in-out infinite;
            }

            .dbp-logo::before {
                content: "";
                position: absolute;
                inset: -1rem;

                border-radius: 3rem;

                border: 1px solid rgba(117, 80, 255, 0.18);

                animation: dbpRing 2.5s ease-out infinite;
            }

            @keyframes dbpLogoFloat {
                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(-7px);
                }
            }

            @keyframes dbpRing {
                0% {
                    transform: scale(0.9);
                    opacity: 0.8;
                }

                100% {
                    transform: scale(1.25);
                    opacity: 0;
                }
            }

            .dbp-lightning {
                width: 5rem;
                height: 5rem;

                fill: none;
                stroke: #ffffff;
                stroke-width: 3;

                filter:
                    drop-shadow(0 0 7px rgba(144, 100, 255, 0.9))
                    drop-shadow(0 0 18px rgba(63, 146, 255, 0.5));
            }

            /* Branding */

            .dbp-brand {
                margin: 0;

                color: #ffffff;

                font-size: clamp(3rem, 8vw, 4.4rem);
                font-weight: 800;
                letter-spacing: -0.08rem;

                text-shadow:
                    0 0 2rem rgba(127, 91, 255, 0.35);
            }

            .dbp-subtitle {
                margin: 0.7rem 0 0;

                color: rgba(190, 198, 230, 0.72);

                font-size: 1.35rem;
                font-weight: 600;

                letter-spacing: 0.35rem;
                text-transform: uppercase;
            }

            /* Status */

            .dbp-status {
                margin-top: 4rem;

                width: 100%;
                max-width: 34rem;
            }

            .dbp-status-row {
                display: flex;
                align-items: center;
                justify-content: space-between;

                margin-bottom: 1.1rem;
            }

            .dbp-status-text {
                color: rgba(219, 224, 247, 0.78);

                font-size: 1.25rem;
                font-weight: 500;
            }

            .dbp-percent {
                color: #ffffff;

                font-size: 1.3rem;
                font-weight: 700;
            }

            /* Progress */

            .dbp-progress {
                width: 100%;
                height: 0.55rem;

                overflow: hidden;

                border-radius: 999px;

                background: rgba(255, 255, 255, 0.07);
            }

            .dbp-progress-bar {
                width: 0%;
                height: 100%;

                border-radius: inherit;

                background:
                    linear-gradient(
                        90deg,
                        #6f42ff,
                        #4e7dff,
                        #38bdf8
                    );

                box-shadow:
                    0 0 1.5rem rgba(92, 86, 255, 0.85);

                transition: width 0.55s ease;
            }

            /* Spinner */

            .dbp-loader {
                width: 2.2rem;
                height: 2.2rem;

                margin: 2.5rem auto 0;

                border-radius: 50%;

                border: 2px solid rgba(255, 255, 255, 0.12);
                border-top-color: #8b6cff;
                border-right-color: #42a5ff;

                animation: dbpSpin 0.85s linear infinite;
            }

            @keyframes dbpSpin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Feature pills */

            .dbp-features {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.7rem;

                margin-top: 3rem;
            }

            .dbp-feature {
                padding: 0.65rem 1rem;

                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 999px;

                background: rgba(255, 255, 255, 0.035);

                color: rgba(205, 212, 239, 0.65);

                font-size: 0.9rem;
                font-weight: 600;

                letter-spacing: 0.08rem;
            }

            /* Footer */

            .dbp-footer {
                position: absolute;
                bottom: 2rem;

                color: rgba(180, 188, 220, 0.35);

                font-size: 0.95rem;
                letter-spacing: 0.05rem;
            }

            /* Mobile */

            @media (max-width: 480px) {
                .dbp-card {
                    min-height: 48rem;
                    padding: 3.5rem 2rem;

                    border-radius: 2.2rem;
                }

                .dbp-logo {
                    width: 7.5rem;
                    height: 7.5rem;
                }

                .dbp-lightning {
                    width: 4.2rem;
                    height: 4.2rem;
                }

                .dbp-status {
                    margin-top: 3.2rem;
                }

                .dbp-features {
                    margin-top: 2.5rem;
                }
            }
        </style>

        <!-- =====================================================
             DBOTPRINT SPLASH CONTROLLER
             ===================================================== -->

        <script>
            (function () {
                const splash =
                    document.getElementById("dbotprint-splash");

                const progressBar =
                    document.getElementById("dbp-progress-bar");

                const percent =
                    document.getElementById("dbp-percent");

                const statusText =
                    document.getElementById("dbp-status-text");

                const steps = [
                    {
                        progress: 0,
                        text: "Initializing DBotPrint",
                    },
                    {
                        progress: 20,
                        text: "Connecting to trading system",
                    },
                    {
                        progress: 45,
                        text: "Syncing market data",
                    },
                    {
                        progress: 70,
                        text: "Loading trading tools",
                    },
                    {
                        progress: 90,
                        text: "Preparing dashboard",
                    },
                    {
                        progress: 100,
                        text: "DBotPrint ready",
                    },
                ];

                let currentStep = 0;

                function updateSplash() {
                    const step = steps[currentStep];

                    progressBar.style.width =
                        step.progress + "%";

                    percent.textContent =
                        step.progress + "%";

                    statusText.textContent =
                        step.text;

                    currentStep++;

                    if (currentStep < steps.length) {
                        setTimeout(updateSplash, 650);
                    } else {
                        setTimeout(function () {
                            splash.classList.add("dbp-hidden");

                            setTimeout(function () {
                                splash.remove();
                            }, 850);
                        }, 700);
                    }
                }

                /*
                 * Start after the browser has painted the
                 * splash screen.
                 */
                requestAnimationFrame(function () {
                    setTimeout(updateSplash, 350);
                });
            })();
        </script>
